<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بطاقة تعريف - مروى الجمال</title>
<!-- ربط ملف CSS الخارجي -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- (ID Selector) -->
<div id="profile-card">
<!-- اللوجو مصمم كـ SVG برمجي مدمج ليظهر دائماً 100% وبأعلى دقة (Element Selector) -->
<img src="IMG_2376.jpeg" alt="">

<!-- خلفية الشعار الفاتحة -->
<rect width="400" height="300" fill="#fce4e4"/>
<!-- حرف M -->
<path d="M 90 200 L 90 90 L 140 160 L 190 90 L 190 200 Z" fill="#18181b"/>
<!-- المثلث الوردي داخل M -->
<path d="M 140 160 L 190 200 L 90 200 Z" fill="#ff3366"/>
<!-- القلم في المنتصف -->
<polygon points="195,30 210,30 202.5,10" fill="#18181b"/>
<rect x="195" y="30" width="15" height="15" fill="#ff6699"/>
<rect x="195" y="45" width="15" height="15" fill="#ffffff"/>
<rect x="195" y="60" width="15" height="140" fill="#18181b"/>
<rect x="195" y="200" width="15" height="15" fill="#ff6699"/>
<polygon points="195,215 210,215 202.5,235" fill="#18181b"/>
<!-- حرف G -->
<path d="M 300 90 C 240 90, 240 200, 300 200 C 340 200, 340 140, 300 140 L 300 160 L 320 160 L 320 180 C 310 185, 290 185, 270 170 C 255 150, 255 130, 270 110 C 290 95, 310 100, 320 110 L 335 95 C 320 85, 290 85, 300 90 Z" fill="#18181b"/>
</svg>

<!-- الاسم كعنوان كبير (Class Selector) -->
<h1 class="user-name">Marwa Al Jamal</h1>

<!-- المسمى الوظيفي -->
<p class="user-title">Software Designer & Developer</p>

<!-- نبذة قصيرة -->
<p class="user-bio">
مصممة ومطورة برمجيات شغوفة بالتصميم الرقمي وتطوير الواجهات، أحرص على تقديم حلول إبداعية تدمج بين الجمال والدقة البرمجية.
</p>

<!-- أزرار التواصل والتفاعل -->
<div class="actions">
<button id="btn-contact">Contact me</button>
<button id="btn-portfolio">My work</button>
<button id="btn-linkedin">LinkedIn</button>
</div>

</div>

</body>
</html>
